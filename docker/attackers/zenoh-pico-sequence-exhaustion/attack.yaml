id: iot_zenoh_pico_sequence_exhaustion
name: Zenoh-Pico Sequence Exhaustion
category: 7) IoT
subcategory: 7.1 IoT Protocols / Zenoh
description: Exhaustion or intensive manipulation of Zenoh/Zenoh-Pico sequence numbers to degrade ordering, reliability, or session-state control.
image: attack-zenoh-pico-sequence-exhaustion:latest
container_name: attack-zenoh-pico-sequence-exhaustion
max_runtime_s: 10
target_services:
- zenoh-router
target_mapping:
  target: target_ip
  port: target_port
mitre:
- https://attack.mitre.org/tactics/TA0040/
- https://attack.mitre.org/techniques/T1499/
- https://attack.mitre.org/techniques/T1499/003/
- https://attack.mitre.org/techniques/T1565/
- https://attack.mitre.org/techniques/T1565/002/
params:
- key: target_ip
  label: Target IP address or FQDN
  kind: ip
  placeholder: __HOST_IP__
- key: target_port
  label: Target port
  kind: port
  placeholder: '7447'
  default: 7447
intensity_params:
- key: duration_s
  default: 10
- key: threads
  default: 4
