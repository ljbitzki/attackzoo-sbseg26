id: iot_zenoh_pico_proto_fuzzer
name: Zenoh-Pico Protocol Fuzzer
category: 7) IoT
subcategory: 7.1 IoT Protocols / Zenoh
description: Sending malformed or mutated Zenoh/Zenoh-Pico messages to trigger errors, exceptions, or crashes on the target.
image: attack-zenoh-pico-proto-fuzzer:latest
container_name: attack-zenoh-pico-proto-fuzzer
max_runtime_s: 10
target_services:
- zenoh-router
target_mapping:
  target: target_ip
  port: target_port
mitre:
- https://attack.mitre.org/tactics/TA0043/
- https://attack.mitre.org/tactics/TA0001/
- https://attack.mitre.org/tactics/TA0040/
- https://attack.mitre.org/techniques/T1595/
- https://attack.mitre.org/techniques/T1595/002/
- https://attack.mitre.org/techniques/T1190/
- https://attack.mitre.org/techniques/T1499/
- https://attack.mitre.org/techniques/T1499/004/
params:
- key: target_ip
  label: Target IP address or FQDN
  kind: ip
  placeholder: __HOST_IP__
- key: target_port
  label: Target port
  kind: port
  placeholder: '7447'
  default: 7447
intensity_params:
- key: duration_s
- key: count
  default: 1000
