id: web_https_heartbleed
name: HTTPS Heartbleed
category: 3) Web Application Attacks
subcategory: 3.1 General Web
description: Heartbleed scanner/exploitation against a vulnerable HTTPS server.
image: attack-web-https-heartbleed:latest
container_name: attack-web-https-heartbleed
max_runtime_s: 10
target_services:
- http-server
target_mapping:
  target: target_ip
  port: target_port
mitre:
- https://attack.mitre.org/tactics/TA0043/
- https://attack.mitre.org/tactics/TA0001/
- https://attack.mitre.org/tactics/TA0009/
- https://attack.mitre.org/techniques/T1595/
- https://attack.mitre.org/techniques/T1595/002/
- https://attack.mitre.org/techniques/T1190/
- https://attack.mitre.org/techniques/T1005/
params:
- key: target_ip
  label: Target IP address or FQDN
  kind: ip
  placeholder: __HOST_IP__
- key: target_port
  label: Target port
  kind: port
  placeholder: '8443'
  default: 8443
