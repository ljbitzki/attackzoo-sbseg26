id: web_sql_injection
name: SQL Injection
category: 3) Web Application Attacks
subcategory: 3.1 General Web
description: SQL injection exploitation tests.
image: attack-sql-injection:latest
container_name: attack-sql-injection
max_runtime_s: 10
target_services:
- http-server
target_mapping:
  target: target_ip
  port: target_port
mitre:
- https://attack.mitre.org/tactics/TA0043/
- https://attack.mitre.org/tactics/TA0001/
- https://attack.mitre.org/techniques/T1595/
- https://attack.mitre.org/techniques/T1595/002/
- https://attack.mitre.org/techniques/T1190/
params:
- key: target_ip
  label: Target IP address or FQDN
  kind: ip
  placeholder: __HOST_IP__
- key: target_port
  label: Target port
  kind: port
  placeholder: '8080'
  default: 8080
