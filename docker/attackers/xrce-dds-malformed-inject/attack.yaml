id: iot_xrce_dds_malformed_inject
name: XRCE-DDS Malformed Injection
category: 7) IoT
subcategory: 7.1 IoT Protocols / XRCE-DDS
description: Injection of malformed XRCE-DDS publications or messages against the agent to trigger errors, exceptions, or crashes.
image: attack-xrce-dds-malformed-inject:latest
container_name: attack-xrce-dds-malformed-inject
max_runtime_s: 30
target_services:
- xrce-dds-agent
target_mapping:
  target: target_ip
  port: target_port
mitre:
- https://attack.mitre.org/tactics/TA0040/
- https://attack.mitre.org/techniques/T1499/
- https://attack.mitre.org/techniques/T1499/004/
- https://attack.mitre.org/techniques/T1190/
params:
- key: target_ip
  label: Target IP address or FQDN
  kind: ip
  placeholder: __HOST_IP__
- key: target_port
  label: Target port
  kind: port
  placeholder: '8888'
  default: 8888
intensity_params:
- key: duration_s
  default: 30
