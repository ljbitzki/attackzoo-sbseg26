id: web_dir_enumeration
name: Web Directory Enumeration
category: 3) Web Application Attacks
subcategory: 3.1 General Web
description: Web server subdirectory and resource enumeration using a wordlist.
image: attack-web-dir-enumeration:latest
container_name: attack-web-dir-enumeration
max_runtime_s: 10
target_services:
- http-server
target_mapping:
  target: target_ip
  port: target_port
details_warning: This attack can generate a large amount of data if captured until its automatic completion. For demonstrations, use less than 5 seconds of execution.
mitre:
- https://attack.mitre.org/tactics/TA0043/
- https://attack.mitre.org/techniques/T1595/
- https://attack.mitre.org/techniques/T1595/003/
params:
- key: target_ip
  label: Target IP address or FQDN
  kind: ip
  placeholder: __HOST_IP__
- key: target_port
  label: Target port
  kind: port
  placeholder: '8080'
  default: 8080
