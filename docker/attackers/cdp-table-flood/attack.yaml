id: net_cdp_table_flood
name: CDP Table Flood
category: 2) Network Interception and Exploitation
subcategory: 2.1 L2/L3
description: CDP (Cisco Discovery Protocol) table flood on the local network.
image: attack-cdp-table-flood:latest
container_name: attack-cdp-table-flood
max_runtime_s: 10
target_services:
- local network
no_params_note: This attack does not require a target and operates at the local network level. Intensity parameters bound unattended campaign runs.
details_warning: The launcher is intentionally capped for campaign safety. Increase count or active_s only after validating host load and capture volume.
mitre:
- https://attack.mitre.org/tactics/TA0040/
- https://attack.mitre.org/techniques/T1498/
- https://attack.mitre.org/techniques/T1498/001/
params:
- key: active_s
  label: Active flood duration inside the attack window (s)
  kind: int
  default: 5
  validate: '^[1-9]\d*$'
  required: false
  positional: false
  env_var: ACTIVE_S
intensity_params:
- key: duration_s
- key: count
  label: Number of yersinia worker processes
  default: 1
- key: delay_ms
  label: Delay between worker starts (ms)
  default: 500
