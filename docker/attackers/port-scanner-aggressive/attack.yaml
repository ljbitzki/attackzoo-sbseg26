id: recon_port_scanner_aggressive
name: Port Scanner Aggressive
category: 1) Reconnaissance and Discovery
subcategory: 1.2 Port, service, OS, and vulnerability scanning
description: Aggressive-profile port and service scan.
image: attack-port-scanner-aggressive:latest
container_name: attack-port-scanner-aggressive
max_runtime_s: 180
target_services:
- target IP service
target_mapping:
  target: target_ip
mitre:
- https://attack.mitre.org/tactics/TA0043/
- https://attack.mitre.org/tactics/TA0007/
- https://attack.mitre.org/techniques/T1590/
- https://attack.mitre.org/techniques/T1592/
- https://attack.mitre.org/techniques/T1595/
- https://attack.mitre.org/techniques/T1595/001/
- https://attack.mitre.org/techniques/T1595/002/
- https://attack.mitre.org/techniques/T1046/
params:
- key: target_ip
  label: Target IP address or FQDN
  kind: ip
  placeholder: __HOST_IP__
