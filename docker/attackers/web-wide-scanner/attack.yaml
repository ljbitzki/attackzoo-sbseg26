id: web_wide_scanner
name: Web Wide Scanner
category: 3) Web Application Attacks
subcategory: 3.1 General Web
description: Broad scanner for known web vulnerabilities.
image: attack-web-wide-scanner:latest
container_name: attack-web-wide-scanner
max_runtime_s: 10
target_services:
- http-server
target_mapping:
  target: target_ip
  port: target_port
details_warning: This attack can generate a large amount of data if captured until its automatic completion. For demonstrations, use less than 5 seconds of execution.
mitre:
- https://attack.mitre.org/tactics/TA0043/
- https://attack.mitre.org/techniques/T1590/
- https://attack.mitre.org/techniques/T1592/
- https://attack.mitre.org/techniques/T1595/
- https://attack.mitre.org/techniques/T1595/002/
params:
- key: target_ip
  label: Target IP address or FQDN
  kind: ip
  placeholder: __HOST_IP__
- key: target_port
  label: Target port
  kind: port
  placeholder: '8080'
  default: 8080
