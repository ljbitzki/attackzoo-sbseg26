id: ssh-server
name: SSH Server
role: target-server
image: server-ssh-server:latest
container_name: server-ssh-server
base_image: ubuntu:24.04
service: OpenSSH with password authentication enabled for a controlled environment
protocols:
- ssh
internal_ports:
- 22/tcp
published_ports:
- 2222:22/tcp
startup: docker run -d --rm --name server-ssh-server -p 2222:22 server-ssh-server:latest
logs: docker exec -it server-ssh-server cat /var/log/messages
purpose: Serve as a target for SSH brute force and ICMP/SSH tunneling in controlled experiments.
observability:
- SSH authentication attempts
- SSH daemon/rsyslog logs
- TCP/22 traffic in PCAP
related_attacks:
- bf_ssh
- exf_icmp_tunnel
benign_clients:
- client-random:ssh
- client-super:ssh
